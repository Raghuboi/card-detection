version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: card-detection-backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=yolov8n.pt
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000
      - ENV=development
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - card-detection-network
    restart: unless-stopped

networks:
  card-detection-network:
    driver: bridge
